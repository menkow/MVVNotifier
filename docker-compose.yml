services:
  notify-bot:
    build: .
    container_name: notify-bot
    restart: unless-stopped
    expose:
      - "9119"
    networks:
      - shared-network
    volumes:
      - ./data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9119/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  shared-network:
    external: true
